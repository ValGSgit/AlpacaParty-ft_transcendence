# Docker Compose — Development
# @owner ValGSgit
# @issue https://github.com/ValGSgit/AlpacaParty/issues/3

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: alpacaparty_db
    environment:
      POSTGRES_DB: ${DB_NAME:-alpacaparty}
      POSTGRES_USER: ${DB_USER:-alpacaparty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alpacaparty}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./PostgreSQL/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alpacaparty}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alpacaparty_net

  # ── Backend (Express) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alpacaparty_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alpacaparty}
      DB_USER: ${DB_USER:-alpacaparty}
      DB_PASSWORD: ${DB_PASSWORD:-alpacaparty}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8080}
      SSL_CERT_PATH: /app/ssl/cert.pem
      SSL_KEY_PATH: /app/ssl/key.pem
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost:8080/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-https://localhost:8080/api/auth/github/callback}
      API_KEYS: ${API_KEYS:-test-api-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # Vault connection (dev mode)
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_TOKEN:-alpacaparty-dev-token}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
      - ./nginx/ssl:/app/ssl:ro
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alpacaparty_net

  # ── Frontend (Vue 3 + Vite) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alpacaparty_frontend
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - alpacaparty_net

  # ── nginx + ModSecurity WAF ──────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: alpacaparty_nginx
    ports:
      - "8080:8443"
      - "8000:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - alpacaparty_net

  # ── HashiCorp Vault (dev mode — auto-unsealed) ─────────────
  vault:
    image: hashicorp/vault:1.16
    container_name: alpacaparty_vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-alpacaparty-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: warn
    ports:
      - "8200:8200"
    volumes:
      - ./vault/init:/vault/init:ro
    command: >-
      sh -c '
        vault server -dev &
        sleep 2 &&
        VAULT_ADDR=http://127.0.0.1:8200
        VAULT_TOKEN=${VAULT_DEV_TOKEN:-alpacaparty-dev-token}
        export VAULT_ADDR VAULT_TOKEN &&
        sh /vault/init/seed.sh &&
        wait
      '
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - alpacaparty_net

  # ── E2E Tests (Playwright) — on-demand ─────────────────────
  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: alpacaparty_e2e
    environment:
      E2E_BASE_URL: http://nginx:8080
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      - nginx
    networks:
      - alpacaparty_net
    profiles:
      - e2e

volumes:
  pg_data:
  backend_uploads:

networks:
  alpacaparty_net:
    driver: bridge
