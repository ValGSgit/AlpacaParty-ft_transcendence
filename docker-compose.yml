# Docker Compose — Development
# @owner ValGSgit
# @issue https://github.com/ValGSgit/Cleanscendence/issues/3

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cleanscendence_db
    environment:
      POSTGRES_DB: ${DB_NAME:-cleanscendence}
      POSTGRES_USER: ${DB_USER:-cleanscendence}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cleanscendence}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./PostgreSQL/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cleanscendence}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cleanscendence_net

  # ── Backend (Express) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleanscendence_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cleanscendence}
      DB_USER: ${DB_USER:-cleanscendence}
      DB_PASSWORD: ${DB_PASSWORD:-cleanscendence}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8080/api/auth/github/callback}
      API_KEYS: ${API_KEYS:-test-api-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cleanscendence_net

  # ── Frontend (Vue 3 + Vite) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cleanscendence_frontend
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cleanscendence_net

  # ── nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cleanscendence_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - cleanscendence_net

  # ── E2E Tests (Playwright) — on-demand ─────────────────────
  e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: cleanscendence_e2e
    environment:
      E2E_BASE_URL: http://nginx:80
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      - nginx
    networks:
      - cleanscendence_net
    profiles:
      - e2e

volumes:
  pg_data:

networks:
  cleanscendence_net:
    driver: bridge
