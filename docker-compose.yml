# Docker Compose — Development
# @owner ValGSgit
# @issue https://github.com/ValGSgit/Cleanscendence/issues/3

version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cleanscendence_db
    environment:
      POSTGRES_DB: ${DB_NAME:-cleanscendence}
      POSTGRES_USER: ${DB_USER:-cleanscendence}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cleanscendence}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./PostgreSQL/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cleanscendence}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cleanscendence_net

  # ── Backend (Express) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleanscendence_backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cleanscendence}
      DB_USER: ${DB_USER:-cleanscendence}
      DB_PASSWORD: ${DB_PASSWORD:-cleanscendence}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cleanscendence_net

  # ── Frontend (Vue 3 + Vite) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cleanscendence_frontend
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cleanscendence_net

  # ── nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cleanscendence_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - cleanscendence_net

volumes:
  pg_data:

networks:
  cleanscendence_net:
    driver: bridge
