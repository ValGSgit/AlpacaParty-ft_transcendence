# PostgreSQL
services:
  postgres:
    image: postgres:16-alpine
    container_name: alpacaparty_db
    environment:
      POSTGRES_DB: ${DB_NAME:-alpacaparty}
      POSTGRES_USER: ${DB_USER:-alpacaparty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alpacaparty}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alpacaparty}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alpacaparty_net
