# Docker Compose — Production
# @owner ValGSgit
# @issue https://github.com/ValGSgit/AlpacaParty/issues/3
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#
# First-time Vault setup (after `up`):
#   docker exec alpacaparty_vault_prod vault operator init
#   docker exec -it alpacaparty_vault_prod vault operator unseal  (repeat 3x)
#   docker exec alpacaparty_vault_prod sh /vault/init/seed.sh
#   Then set VAULT_TOKEN in .env to the root token and restart backend.

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: alpacaparty_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-alpacaparty}
      POSTGRES_USER: ${DB_USER:-alpacaparty}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./PostgreSQL/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alpacaparty}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - alpacaparty_net

  # ── HashiCorp Vault (production — file storage backend) ────
  # Uses file-based storage for persistence and encryption at rest.
  # Requires manual init + unseal on first deployment.
  vault:
    image: hashicorp/vault:1.16
    container_name: alpacaparty_vault_prod
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_API_ADDR: http://vault:8200
      VAULT_LOG_LEVEL: warn
    volumes:
      - vault_data:/vault/data
      - ./vault/config/vault-prod.hcl:/vault/config/vault.hcl:ro
      - ./vault/init:/vault/init:ro
    # Port is NOT exposed externally in prod; backend reaches it via container network.
    # Uncomment to expose the UI behind a VPN/bastion for initial setup:
    # ports:
    #   - "8200:8200"
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8200/v1/sys/seal-status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: always
    networks:
      - alpacaparty_net

  # ── Vault init — seeds secrets after Vault is ready ────────
  # NOTE: In production, vault-init only works AFTER manual unseal.
  # On first deploy, run seed.sh manually instead:
  #   docker exec alpacaparty_vault_prod sh /vault/init/seed.sh
  vault-init:
    image: hashicorp/vault:1.16
    container_name: alpacaparty_vault_init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER:-alpacaparty}
      DB_NAME: ${DB_NAME:-alpacaparty}
      JWT_SECRET: ${JWT_SECRET}
      API_KEYS: ${API_KEYS:-test-api-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./vault/init:/vault/init:ro
    command: sh /vault/init/seed.sh
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"
    networks:
      - alpacaparty_net

  # ── Backend (Express) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: alpacaparty_backend_prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alpacaparty}
      DB_USER: ${DB_USER:-alpacaparty}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-alpacaparty}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-alpacaparty}?schema=public}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8080}
      SSL_CERT_PATH: /app/ssl/cert.pem
      SSL_KEY_PATH: /app/ssl/key.pem
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost:8080/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-https://localhost:8080/api/auth/github/callback}
      API_KEYS: ${API_KEYS:-test-api-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # Vault connection
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --tries=1 --spider https://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - alpacaparty_net

  # ── Frontend (Static Files) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: alpacaparty_frontend_prod
    depends_on:
      - backend
    restart: always
    networks:
      - alpacaparty_net

  # ── nginx + ModSecurity WAF ────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: alpacaparty_nginx_prod
    ports:
      - "${NGINX_PORT:-8080}:8443"
      - "8000:8080"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: always
    networks:
      - alpacaparty_net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pg_data:
    driver: local
  vault_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  alpacaparty_net:
    driver: bridge
