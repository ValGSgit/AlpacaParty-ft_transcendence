# Docker Compose — Production
# @owner ValGSgit
# @issue https://github.com/ValGSgit/AlpacaParty/issues/3
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: alpacaparty_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-alpacaparty}
      POSTGRES_USER: ${DB_USER:-alpacaparty}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./PostgreSQL/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alpacaparty}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - alpacaparty_net

  # ── Backend (Express) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: alpacaparty_backend_prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-alpacaparty}
      DB_USER: ${DB_USER:-alpacaparty}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-alpacaparty}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-alpacaparty}?schema=public}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8080/api/auth/github/callback}
      API_KEYS: ${API_KEYS:-test-api-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      # Vault connection
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - alpacaparty_net

  # ── Frontend (Static Files) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: alpacaparty_frontend_prod
    depends_on:
      - backend
    restart: always
    networks:
      - alpacaparty_net

  # ── nginx + ModSecurity WAF ────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: alpacaparty_nginx_prod
    ports:
      - "${NGINX_PORT:-8080}:8443"
      - "8000:8080"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: always
    networks:
      - alpacaparty_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── HashiCorp Vault ────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.16
    container_name: alpacaparty_vault_prod
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        ui            = true
        disable_mlock = true
        storage "file" { path = "/vault/data" }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = 1
        }
      VAULT_LOG_LEVEL: warn
    volumes:
      - vault_data:/vault/data
      - ./vault/init:/vault/init:ro
    # Port is NOT exposed externally in prod; backend reaches it via container network.
    # Remove the comment below to expose the UI behind a VPN/bastion.
    # ports:
    #   - "8200:8200"
    command: vault server -config=/vault/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    networks:
      - alpacaparty_net

volumes:
  pg_data:
    driver: local
  backend_uploads:
    driver: local
  vault_data:
    driver: local

networks:
  alpacaparty_net:
    driver: bridge
