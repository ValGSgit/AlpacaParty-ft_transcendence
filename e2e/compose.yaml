# E2E Tests (Playwright) — on-demand
services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpacaparty_e2e
    environment:
      E2E_BASE_URL: https://nginx:443
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    depends_on:
      - nginx
    networks:
      - alpacaparty_net
    profiles:
      - e2e
