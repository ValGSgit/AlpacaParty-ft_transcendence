# Frontend (Vue 3 + Vite) — Production
services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: alpacaparty_frontend_prod
    depends_on:
      - backend
    restart: always
    networks:
      - alpacaparty_net
