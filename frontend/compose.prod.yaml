# Frontend (Vue 3 + Vite) — Production
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: frontend_prod
    ports:
      - "80:80"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - alpacaparty_net

