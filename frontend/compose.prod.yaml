
# Frontend (Vue 3 + Vite) — Production
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: frontend_prod
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ssl:/etc/nginx/conf/ssl
    healthcheck:
      # Vite preview serves index.html on 5173 — a 2xx response means the
      # build succeeded and the static server is up. Without this check
      # nginx will proxy to a broken upstream silently.
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    networks:
      - alpacaparty_net
