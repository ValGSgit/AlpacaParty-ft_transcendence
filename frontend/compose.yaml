# Frontend (Vue 3 + Vite)
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpacaparty_frontend
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - alpacaparty_net
