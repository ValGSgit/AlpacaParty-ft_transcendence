
# Frontend
services:
  frontend:
    profiles:
      - dev
    image: alpacaparty/frontend:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: /api
    volumes:
      - frontend_data:/app
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - alpacaparty_net

