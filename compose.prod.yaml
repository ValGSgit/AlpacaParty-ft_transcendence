# Docker Compose — Production
# @owner ValGSgit
# @issue https://github.com/ValGSgit/AlpacaParty/issues/3
#
# Usage:
#   make prod-up
#
# Vault is fully automated:
#   - vault-init initializes, unseals, and seeds Vault on first boot
#   - Unseal key + service token are saved to the vault_keys Docker volume
#   - On reboots vault-init reads the key from the volume and unseals automatically
#   - The backend reads VAULT_TOKEN from the volume — no manual steps required

include:
  - ./backend/compose.prod.yaml
  - ./frontend/compose.prod.yaml
  - ./nginx/compose.prod.yaml
  - ./database/compose.prod.yaml
  - ./vault/compose.prod.yaml

volumes:
  pg_data:
    driver: local
  vault_data:
    driver: local
  vault_keys:
    driver: local
  backend_uploads:
    driver: local
  ssl:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./ssl

networks:
  alpacaparty_net:
    name: alpacaparty_net
    driver: bridge
