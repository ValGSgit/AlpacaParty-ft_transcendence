# Docker Compose — Production
#
# Usage: make prod-up
#
# Vault runs in dev mode (auto-unsealed, fixed root token from VAULT_TOKEN
# env var). vault-init seeds app secrets once Vault is healthy.

include:
  - ./backend/compose.prod.yaml
  - ./frontend/compose.prod.yaml
  - ./nginx/compose.prod.yaml
  - ./database/compose.prod.yaml
  - ./vault/compose.prod.yaml

volumes:
  pg_data:
    driver: local
  backend_uploads:
    driver: local
  ssl:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./ssl

networks:
  alpacaparty_net:
    name: alpacaparty_net
    driver: bridge
