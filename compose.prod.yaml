# Docker Compose — Production
#
# Usage: make prod-up

include:
  - ./backend/compose.prod.yaml
  - ./frontend/compose.prod.yaml
  - ./nginx/compose.prod.yaml
  - ./database/compose.prod.yaml

volumes:
  pg_data:
    driver: local
  backend_uploads:
    driver: local
  ssl:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./ssl

networks:
  alpacaparty_net:
    name: alpacaparty_net
    driver: bridge
