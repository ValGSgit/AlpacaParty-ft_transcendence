# HashiCorp Vault — dev mode (auto-unsealed, UI enabled, in-memory storage).
# Fixed root token, KV v2 pre-mounted at `secret/`. The vault-init container
# seeds app secrets once Vault is healthy.
services:
  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-alpacaparty-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: always
    networks:
      - alpacaparty_net

  vault-init:
    image: hashicorp/vault:1.16
    container_name: vault_init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-alpacaparty-dev-token}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER:-alpacaparty}
      DB_NAME: ${DB_NAME:-alpacaparty}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_PUBLIC_API_SECRET: ${JWT_PUBLIC_API_SECRET}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
      API_KEYS: ${API_KEYS:-change-me-to-a-secure-key}
      GROQ_API_KEY1: ${GROQ_API_KEY1:-}
      GROQ_API_KEY2: ${GROQ_API_KEY2:-}
      GROQ_API_KEY3: ${GROQ_API_KEY3:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
    volumes:
      - ./init:/vault/init:ro
    command: sh /vault/init/seed.sh
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"
    networks:
      - alpacaparty_net
