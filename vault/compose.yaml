
# HashiCorp Vault (dev mode — auto-unsealed)
services:
  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: warn
    ports:
      - "8200:8200"
    volumes:
      - ./init:/vault/init:ro
    command: >-
      sh -c '
        vault server -dev &
        sleep 2 &&
        sh /vault/init/seed.sh &&
        wait %1
      '
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - alpacaparty_net
