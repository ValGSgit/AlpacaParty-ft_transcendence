# HashiCorp Vault (dev mode — auto-unsealed)
services:
  vault:
    image: hashicorp/vault:1.16
    container_name: alpacaparty_vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-alpacaparty-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_LOG_LEVEL: warn
    ports:
      - "8200:8200"
    volumes:
      - ./init:/vault/init:ro
      - ssl:/vault/ssl:ro
    command: >-
      sh -c '
        vault server -dev &
        sleep 2 &&
        VAULT_ADDR=http://127.0.0.1:8200
        VAULT_TOKEN=${VAULT_DEV_TOKEN:-alpacaparty-dev-token}
        export VAULT_ADDR VAULT_TOKEN &&
        sh /vault/init/seed.sh &&
        wait
      '
    healthcheck:
      test: ["CMD-SHELL", "export VAULT_ADDR=http://127.0.0.1:8200; vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - alpacaparty_net
