# SpitRoyale — game WebSocket server + static Vite build
services:
  spittroyale:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpacaparty_spittroyale
    environment:
      NODE_ENV: development
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped
    networks:
      - alpacaparty_net
