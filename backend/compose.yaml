services:
  backend_base:
    profiles:
      - template
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${PRISMA_STUDIO_PORT}:${PRISMA_STUDIO_PORT}"
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
      SSL_CERT_PATH: /app/ssl/cert.pem
      SSL_KEY_PATH: /app/ssl/key.pem
      CORS_ORIGINS: "${CORS_ORIGINS}"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-alpacaparty-dev-token}
      UPLOAD_DIR: "/app/uploads"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1h}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
      JWT_PUBLIC_API_EXPIRES_IN: "${JWT_PUBLIC_API_EXPIRES_IN:-30d}"
      JWT_ADMIN_EXPIRES_IN: "${JWT_ADMIN_EXPIRES_IN:-30d}"
      PUBLIC_API_HOST: "${PUBLIC_API_HOST}"
    tmpfs:
      - /run/secrets:size=64m,mode=1777
    volumes:
      - backend_data:/app
      - ssl:/app/ssl
    networks:
      - alpacaparty_net

  backend:
    profiles:
      - dev
    extends: backend_base
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    restart: unless-stopped

  backend_test:
    profiles:
      - test
    extends: backend_base
    depends_on:
      postgres_test:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    restart: no
