
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
      - "${PRISMA_STUDIO_PORT:-5555}:${PRISMA_STUDIO_PORT:-5555}"
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-alpacaparty}
      DB_USER: ${DB_USER:-alpacaparty}
      DB_PASSWORD: ${DB_PASSWORD:-alpacaparty}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8443}
      SSL_CERT_PATH: /app/ssl/cert.pem
      SSL_KEY_PATH: /app/ssl/key.pem
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost:8443/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-https://localhost:8443/api/auth/github/callback}
      API_KEYS: ${API_KEYS:-test-api-key}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      DATABASE_URL: "postgresql://${DB_USER:-alpacaparty}:${DB_PASSWORD:-alpacaparty}@postgres:5432/${DB_NAME:-alpacaparty}?schema=public"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,https://localhost:8443}"
      VAULT_ADDR: https://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_TOKEN:-alpacaparty-dev-token}
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - ssl:/app/ssl
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alpacaparty_net
