# AlpacaParty — Continuous Integration
#
# Jobs:
#   1. backend-unit  — Jest unit + integration tests (mocked DB)
#   2. frontend-unit — Vitest component + store tests
#   3. e2e           — Playwright full-stack tests (push only)

name: CI

on:
  push:
    branches: [main, dev, backend-main, backend-Val]
  pull_request:
    branches: [main, dev, backend-main, backend-Val]

# Cancel in-progress runs for the same branch/PR on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

# ==================================================================
# JOB 1 — Backend unit & integration tests
# ==================================================================
jobs:
  backend-unit:
    name: "Backend — Unit Tests"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-prod

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  # ==================================================================
  # JOB 2 — Frontend unit tests
  # ==================================================================
  frontend-unit:
    name: "Frontend — Unit Tests"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # ==================================================================
  # JOB 3 — E2E tests (Playwright + full docker-compose stack)
  #          Runs on push only — skipped on pull requests
  # ==================================================================
  e2e:
    name: "E2E — Playwright"
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Install Playwright system deps (cache hit)
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox

      # -- Start the full stack -------------------------------------
      - name: Start application stack
        run: docker compose up -d --build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-e2e-secret-change-in-prod' }}
          DB_NAME: alpacaparty
          DB_USER: alpacaparty
          DB_PASSWORD: alpacaparty

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend health endpoint..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Backend is healthy after ${i} attempts"
              exit 0
            fi
            echo "  Attempt $i/30 — retrying in 5s..."
            sleep 5
          done
          echo "Backend did not become healthy in time"
          docker compose logs
          exit 1

      # -- Run tests ------------------------------------------------
      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:8080

      # -- Artifacts ------------------------------------------------
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload traces and screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

      # -- Teardown -------------------------------------------------
      - name: Stop application stack
        if: always()
        run: docker compose down -v
