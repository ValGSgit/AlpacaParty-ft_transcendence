# AlpacaParty — Continuous Integration
#
# Jobs:
#   1. backend-unit   — Jest unit + integration tests (mocked DB)
#   2. frontend-unit  — Vitest unit tests
#   3. e2e            — Playwright full-stack tests with seed data (push only)

name: CI

on:
  push:
    branches: [main, dev, backend, fixUnitTests+Workflow-fix]
  pull_request:
    branches: [main, dev, backend, fixUnitTests+Workflow-fix]

# Cancel in-progress runs for the same branch/PR on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# ==================================================================
# JOB 1 — Backend unit & integration tests
# ==================================================================
jobs:
  backend-unit:
    name: "Backend — Unit Tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alpacaparty
          POSTGRES_USER: alpacaparty
          POSTGRES_PASSWORD: alpacaparty
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alpacaparty -d alpacaparty"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      API_PORT: 3000
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      DATABASE_URL: postgresql://alpacaparty:alpacaparty@127.0.0.1:5432/alpacaparty?schema=public
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: alpacaparty
      DB_USER: alpacaparty
      DB_PASSWORD: alpacaparty
      SSL_CERT_PATH: ./ssl/cert.pem
      SSL_KEY_PATH: ./ssl/key.pem
      UPLOAD_DIR: ./uploads

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            echo "Backend npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "Backend npm ci failed after 3 attempts"
          exit 1

      - name: Sync test database schema
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Prisma db push attempt ${attempt}/3"
            if npx prisma db push; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "db push failed, retrying in 4 seconds..."
              sleep 4
            fi
          done
          echo "Prisma db push failed after 3 attempts"
          npx prisma validate || true
          exit 1
        
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  # ==================================================================
  # JOB 2 — Frontend unit tests
  # ==================================================================
  frontend-unit:
    name: "Frontend — Unit Tests"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            echo "Frontend npm install attempt ${attempt}/3"
            if npm install; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm install failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "Frontend npm install failed after 3 attempts"
          exit 1

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # ==================================================================
  # JOB 3 — E2E tests (Playwright + full docker-compose stack)
  #          Runs on push only — skipped on pull requests
  # ==================================================================
  e2e:
    name: "E2E — Playwright"
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    if: github.event_name == 'push'
    env:
      COMPOSE_PROFILES: dev,e2e
      NODE_ENV: test
      API_PORT: "3000"
      PRISMA_STUDIO_PORT: "5555"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: alpacaparty
      DB_USER: alpacaparty
      DB_PASSWORD: alpacaparty
      FRONTEND_URL: https://localhost:8443
      CORS_ORIGINS: https://localhost:8443,http://localhost:5173
      GOOGLE_CALLBACK_URL: https://localhost:8443/api/auth/google/callback
      GITHUB_CALLBACK_URL: https://localhost:8443/api/auth/github/callback
      JWT_SECRET: ci-e2e-secret-change-in-prod
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      VAULT_DEV_TOKEN: root
      API_KEYS: ci-e2e-api-key
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      MOD_USERS: live_admin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            echo "E2E npm ci attempt ${attempt}/3"
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "E2E npm ci failed after 3 attempts"
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # -- Generate SSL certs (mirrors `make ssl-certs`) -----------
      - name: Generate self-signed SSL certificates
        run: |
          mkdir -p nginx/ssl backend/ssl
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout nginx/ssl/key.pem \
            -out nginx/ssl/cert.pem \
            -days 365 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,DNS:vault,DNS:backend,DNS:nginx,IP:127.0.0.1'
          cp nginx/ssl/cert.pem backend/ssl/cert.pem
          cp nginx/ssl/key.pem  backend/ssl/key.pem

      # -- Install deps so bind-mount volumes exist ----------------
      - name: Install backend and frontend dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

          for attempt in 1 2 3; do
            echo "Backend npm ci --ignore-scripts attempt ${attempt}/3"
            if (cd backend && npm ci --ignore-scripts); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Backend dependency install failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

          for attempt in 1 2 3; do
            echo "Frontend npm install --include=optional attempt ${attempt}/3"
            if (cd frontend && npm install --include=optional); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Frontend dependency install failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      # -- Start the full stack -------------------------------------
      - name: Start application stack
        run: |
          docker compose build --no-cache frontend nginx
          docker compose up -d --build postgres backend frontend nginx

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend health endpoint..."
          for i in $(seq 1 30); do
            if curl -ksfL https://localhost:8443/api/health > /dev/null 2>&1; then
              echo "Backend is healthy after ${i} attempts"
              exit 0
            fi
            echo "  Attempt $i/30 — retrying in 5s..."
            sleep 5
          done
          echo "Backend did not become healthy in time"
          docker compose logs
          exit 1

      - name: Sync database schema
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Prisma db push attempt ${attempt}/3"
            if docker compose exec -T -e DATABASE_URL="postgresql://alpacaparty:alpacaparty@postgres:5432/alpacaparty?schema=public" backend npx prisma db push; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "db push failed, retrying in 4 seconds..."
              sleep 4
            fi
          done
          echo "Prisma db push failed after 3 attempts"
          exit 1

      - name: Generate Prisma client
        run: docker compose exec -T -e DATABASE_URL="postgresql://alpacaparty:alpacaparty@postgres:5432/alpacaparty?schema=public" backend npx prisma generate

      # -- Seed data for E2E tests ----------------------------------
      - name: Seed live data for E2E tests
        run: docker compose exec -T backend npm run seed:live
        env:
          SEED_USERS: "50"
          SEED_POSTS: "100"
          SEED_DM_MESSAGES: "200"
          SEED_ROOMS: "5"
          SEED_ROOM_MESSAGES: "200"
          SEED_NOTIFICATIONS: "100"

      # -- Run tests ------------------------------------------------
      - name: Sanity check public API key before Playwright
        run: |
          code=$(curl -ks -o /tmp/public_api.json -w "%{http_code}" \
            -H "X-API-Key: ci-e2e-api-key" \
            "https://localhost:8443/api/public/users?limit=1")
          echo "Public API status: $code"
          cat /tmp/public_api.json || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Public API key sanity check failed"
            exit 1
          fi

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: https://localhost:8443
          E2E_API_KEY: ci-e2e-api-key

      # -- Artifacts ------------------------------------------------
      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Upload traces and screenshots on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

      # -- Teardown -------------------------------------------------
      - name: Stop application stack
        if: always()
        run: docker compose down -v
