# nginx Reverse Proxy Configuration — Production (HTTPS)
# @owner DavidPoetsch
# @issue https://github.com/ValGSgit/AlpacaParty/issues/4
#
# /api/*       → backend:3000
# /socket.io/* → backend:3000 (WebSocket upgrade)
# /*           → frontend:80  (pre-built static files served by nginx)

upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:80;
}

# HTTP → HTTPS redirect
server {
    listen 8080;
    server_name _;
    return 301 https://$host:8080$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    # ── SSL ───────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/conf/server.crt;
    ssl_certificate_key /etc/nginx/conf/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Upload size limit ─────────────────────────────────────
    client_max_body_size 15m;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               application/xml+rss;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' wss: ws: blob:; font-src 'self' https://fonts.gstatic.com;" always;

    # ── API proxy ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         https://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        # Allow self-signed certificates from backend
        proxy_ssl_verify off;
    }

    # ── WebSocket proxy (Socket.io) ──────────────────────────
    location /socket.io/ {
        proxy_pass         https://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        # Allow self-signed certificates from backend
        proxy_ssl_verify off;
    }

    # ── Uploaded files ─────────────────────────────────────────
    location /uploads/ {
        proxy_pass         https://backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow self-signed certificates from backend
        proxy_ssl_verify off;
    }

    # ── SPA / Frontend ───────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
