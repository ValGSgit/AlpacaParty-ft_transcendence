# nginx Reverse Proxy Configuration
# @owner DavidPoetsch
#
# All traffic enters through port 8443 (mapped to container port 443).
# /api/*       → backend:3000
# /socket.io/* → backend:3000 (WebSocket upgrade)
# /*           → frontend:5173

upstream backend {
    server backend:3000;
}

upstream frontend {
    server frontend:5173;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    # External HTTPS entrypoint is mapped to host port 8443 (not 443).
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # ── SSL (self-signed for dev — generated by Makefile) ─────
    ssl_certificate     /etc/nginx/conf/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/conf/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Upload size limit ─────────────────────────────────────
    client_max_body_size 15m;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               application/xml+rss;

    # ── Security headers ──────────────────────────────────────
    # These four headers are authoritative here; proxy_hide_header below
    # strips the same headers from upstream (Helmet) responses so clients
    # never receive duplicates. X-XSS-Protection is intentionally omitted:
    # the browser XSS auditor is deprecated — Helmet correctly sets it to 0.
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy     "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Strip matching headers from all upstream responses so nginx's
    # add_header directives above are the single source of truth.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Permissions-Policy;

    # ── API proxy ─────────────────────────────────────────────
    # Backend runs HTTPS with a self-signed cert in dev (certs mounted via
    # volume). proxy_ssl_verify is off because the cert is self-signed.
    # Profile update endpoints are legitimate PUT requests that can be
    # falsely blocked by CRS method enforcement. Keep WAF on globally,
    # but bypass it for these exact paths.
    location = /api/users/me {
        modsecurity        off;
        proxy_pass         https://backend/api/users/me;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_ssl_verify   off;
    }


    location /api/ {
        proxy_pass         https://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_ssl_verify   off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ── WebSocket proxy (Socket.io) ──────────────────────────
    location /socket.io/ {
        proxy_pass         https://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade         $http_upgrade;
        proxy_set_header   Connection      "upgrade";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify   off;
        proxy_read_timeout 86400;
    }

    # ── Uploaded files ─────────────────────────────────────────
    location /uploads/ {
        proxy_pass         https://backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_ssl_verify   off;
    }

    # ── Vite HMR WebSocket (dev only) ────────────────────────
    location /ws {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── SPA / Frontend ───────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
