# ModSecurity Configuration — AlpacaParty
# Loaded by the owasp/modsecurity-crs:nginx image automatically.
# This file overrides defaults; the full CRS ruleset is already bundled.

# ── Engine ────────────────────────────────────────────────────────────────
SecRuleEngine On          # DetectionOnly | On

# ── Audit / Logging ───────────────────────────────────────────────────────
SecAuditEngine RelevantOnly
SecAuditLog    /var/log/modsecurity/audit.log
# Parts: A=header B=request-headers F=response-headers H=trailer K=matched-rules Z=boundary
# Excludes C (request body — may contain passwords) and E (response body — may contain tokens)
SecAuditLogParts ABFHKZ
SecAuditLogType Serial
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# Log to stderr so docker logs picks it up.
SecDebugLog /dev/stderr
SecDebugLogLevel 1        # 0=off 1=error 3=warning 9=verbose

# ── Request tuning ────────────────────────────────────────────────────────
SecRequestBodyAccess On
SecRequestBodyLimit 10485760          # 10 MB
SecRequestBodyNoFilesLimit 131072     # 128 KB for non-file fields
SecRequestBodyLimitAction Reject

SecResponseBodyAccess Off             # don't inspect response bodies (performance)

# ── Anti-false-positive tuning for our SPA/API ────────────────────────────
# The OWASP CRS triggers on JSON payloads, file uploads, and large cookies.
# We suppress specific rule IDs that are known false-positives.
#
# NOTE: PUT/DELETE/PATCH are allowed via the ALLOWED_METHODS ENV variable set
# in Dockerfile.prod. The CRS image substitutes this into crs-setup.conf at
# startup (rule 900200). Do NOT add a SecAction with id:900200 here — it would
# conflict with the generated rule and cause a duplicate-ID error.

# Profile-edit endpoint (/api/users/me) tuning: keep WAF ON but suppress the
# specific CRS rules that false-positive on legitimate JSON PUTs carrying a
# base64 avatar, free-form bio, etc.
#   911100 — method enforcement (we explicitly allow PUT/PATCH/DELETE)
#   920420 — request content-type not allowed (CRS sometimes flags JSON PUTs)
#   942100 — generic SQLi libinjection on JSON body
#   941100 — XSS detection on attributes (false-positive on free-form text)
#   932100/931100 — RCE/RFI false positives on innocuous bio/status content
SecRule REQUEST_FILENAME "@beginsWith /api/users/me" \
  "id:9000004,phase:1,nolog,pass,\
   ctl:ruleRemoveById=911100,\
   ctl:ruleRemoveById=920420,\
   ctl:ruleRemoveById=942100,\
   ctl:ruleRemoveById=941100,\
   ctl:ruleRemoveById=932100,\
   ctl:ruleRemoveById=931100"

# Allow large JSON bodies for the game save endpoint (PUT /api/users/me)
SecRuleUpdateTargetById 200002 "!REQUEST_BODY"

# Farm autosave endpoint (/api/game/farm) tuning. The PUT body carries the full
# farm state — model file paths ("models/items/tree.glb"), 3D positions/rotations
# and alpaca data — which false-positives the same CRS rules as the profile
# endpoint (the file-path strings read as LFI/RFI, the JSON reads as SQLi/XSS).
# Without this, prod (WAF on) rejects every autosave with 400 and the farm never
# persists, so upgrades/placed items are lost on reload. Dev has modsecurity off,
# which is why it only reproduces in prod. Mirror the /api/users/me exclusions.
SecRule REQUEST_FILENAME "@beginsWith /api/game/farm" \
  "id:9000005,phase:1,nolog,pass,\
   ctl:ruleRemoveById=911100,\
   ctl:ruleRemoveById=920420,\
   ctl:ruleRemoveById=942100,\
   ctl:ruleRemoveById=941100,\
   ctl:ruleRemoveById=932100,\
   ctl:ruleRemoveById=931100"

# CRS anomaly scoring — raise threshold slightly to avoid blocking valid API
# requests that carry large base64 avatar data.
SecAction \
  "id:900110,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.inbound_anomaly_score_threshold=10,\
   setvar:tx.outbound_anomaly_score_threshold=4"

# ── Exclusions for our specific paths ─────────────────────────────────────
# /api/uploads — multipart upload; skip body inspection
SecRule REQUEST_URI "@beginsWith /api/uploads" \
  "id:9000001,phase:1,nolog,pass,ctl:requestBodyAccess=Off"

# /api/auth    — SQL injection WAF rules are intentionally kept ON for auth endpoints.
#               Prisma's parameterised queries prevent actual injection, but the WAF
#               layer provides defence-in-depth and should never be disabled.
