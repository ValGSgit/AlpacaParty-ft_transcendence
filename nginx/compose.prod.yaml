# nginx + ModSecurity WAF — Production
services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: alpacaparty_nginx_prod
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ssl:/etc/nginx/conf/ssl
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: always
    networks:
      - alpacaparty_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO /dev/null https://127.0.0.1:8443/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
