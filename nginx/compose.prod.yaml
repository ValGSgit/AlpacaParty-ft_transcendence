
# todo ports wrong probably we should use 443
# also why does 8000 map to 8080 and not 8080 map to 8080?

# nginx + ModSecurity WAF
services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nginx
    ports:
      - "8080:8443"
      - "8000:8080"
    volumes:
      - ssl:/etc/nginx/conf/ssl
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: always
    networks:
      - alpacaparty_net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
